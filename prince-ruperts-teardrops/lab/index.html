<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prince Rupert Drop Lab</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #fff;
      touch-action: none;
    }

    .panel {
      position: fixed;
      top: 12px;
      right: 12px;
      display: grid;
      gap: 8px;
      width: min(210px, calc(100vw - 24px));
      padding: 10px;
      border: 1px solid #000;
      background: rgba(255, 255, 255, 0.94);
      color: #000;
      font-size: 13px;
    }

    .row {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 8px;
      align-items: center;
      min-height: 26px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #000;
    }

    input[type="checkbox"] {
      accent-color: #000;
      justify-self: start;
    }

    button {
      min-height: 32px;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font: inherit;
      cursor: pointer;
    }

    button:active {
      background: #000;
      color: #fff;
    }

    .legend {
      position: fixed;
      left: 14px;
      bottom: 14px;
      width: 10px;
      height: 150px;
      border: 1px solid #000;
      background: linear-gradient(to top, #206ad7, #f7f0c8, #d8172f);
    }
  </style>
</head>
<body>
  <form class="panel" id="panel">
    <label class="row"><span>Force</span><input id="force" name="force" type="range" min="0" max="1" step="0.005" value="0"></label>
    <label class="row"><span>Cut</span><input id="cut" name="cut" type="checkbox"></label>
    <label class="row"><span>Field</span><input id="field" name="field" type="checkbox"></label>
    <label class="row"><span>Slow-mo</span><input id="slowmo" name="slowmo" type="range" min="0.05" max="1" step="0.05" value="0.25"></label>
    <button id="reset" type="button">Reset</button>
  </form>
  <div class="legend"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
