<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spine Radius Drop Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #fff;
    }

    .panel {
      position: fixed;
      top: 12px;
      right: 12px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      width: min(300px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow: auto;
      padding: 10px;
      border: 1px solid #000;
      background: rgba(255, 255, 255, 0.94);
      color: #000;
      font-size: 13px;
    }

    .row {
      display: grid;
      grid-template-columns: 78px 1fr 44px;
      gap: 8px;
      align-items: center;
      min-height: 28px;
    }

    .row.checkbox {
      grid-template-columns: 1fr auto;
    }

    label,
    output {
      line-height: 1.2;
    }

    output {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #000;
    }

    input[type="checkbox"] {
      accent-color: #000;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      min-height: 32px;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font: inherit;
      cursor: pointer;
    }

    button:active {
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="drop"></canvas>

  <form class="panel" id="controls">
    <div class="row">
      <label for="headSize">Head</label>
      <input id="headSize" name="headSize" type="range" min="70" max="180" value="104" step="1">
      <output for="headSize"></output>
    </div>
    <div class="row">
      <label for="headPos">Position</label>
      <input id="headPos" name="headPos" type="range" min="0.10" max="0.30" value="0.17" step="0.01">
      <output for="headPos"></output>
    </div>
    <div class="row">
      <label for="headSmooth">Head ease</label>
      <input id="headSmooth" name="headSmooth" type="range" min="0.35" max="1.40" value="0.52" step="0.01">
      <output for="headSmooth"></output>
    </div>
    <div class="row">
      <label for="tailTaper">Tail taper</label>
      <input id="tailTaper" name="tailTaper" type="range" min="1.0" max="8.0" value="3.60" step="0.1">
      <output for="tailTaper"></output>
    </div>
    <div class="row">
      <label for="bend">Bend</label>
      <input id="bend" name="bend" type="range" min="320" max="860" value="690" step="1">
      <output for="bend"></output>
    </div>
    <div class="row">
      <label for="hook">Hook</label>
      <input id="hook" name="hook" type="range" min="-160" max="160" value="106" step="1">
      <output for="hook"></output>
    </div>
    <div class="row">
      <label for="length">Length</label>
      <input id="length" name="length" type="range" min="900" max="1500" value="1230" step="5">
      <output for="length"></output>
    </div>
    <label class="row checkbox" for="guides">
      <span>Guides</span>
      <input id="guides" name="guides" type="checkbox">
    </label>
    <div class="actions">
      <button id="reset" type="button">Reset</button>
      <button id="exportSvg" type="button">SVG</button>
    </div>
  </form>

  <script>
    const canvas = document.getElementById("drop");
    const ctx = canvas.getContext("2d");
    const controls = document.getElementById("controls");
    const resetButton = document.getElementById("reset");
    const exportButton = document.getElementById("exportSvg");

    const defaults = {
      headSize: 104,
      headPos: 0.17,
      headSmooth: 0.52,
      tailTaper: 3.60,
      bend: 690,
      hook: 106,
      length: 1230,
      guides: false
    };

    const sampleCount = 520;
    let view = { x: 0, y: 0, scale: 1 };
    let currentShape = null;

    function resize() {
      const deviceScale = window.devicePixelRatio || 1;
      canvas.width = Math.round(window.innerWidth * deviceScale);
      canvas.height = Math.round(window.innerHeight * deviceScale);
      ctx.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
      draw();
    }

    function draw() {
      const params = readParams();
      writeOutputs(params);
      currentShape = buildShape(params);
      view = fitView(currentShape.outline);

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.save();
      ctx.translate(view.x, view.y);
      ctx.scale(view.scale, view.scale);

      drawShape(currentShape.outline);
      if (params.guides) {
        drawGuides(currentShape);
      }

      ctx.restore();
    }

    function readParams() {
      const data = new FormData(controls);
      return {
        headSize: Number(data.get("headSize")),
        headPos: Number(data.get("headPos")),
        headSmooth: Number(data.get("headSmooth")),
        tailTaper: Number(data.get("tailTaper")),
        bend: Number(data.get("bend")),
        hook: Number(data.get("hook")),
        length: Number(data.get("length")),
        guides: data.has("guides")
      };
    }

    function writeOutputs(params) {
      controls.querySelectorAll("input[type='range']").forEach((input) => {
        const output = controls.querySelector(`output[for='${input.id}']`);
        output.value = formatValue(params[input.name]);
      });
    }

    function formatValue(value) {
      if (Math.abs(value) < 10 && !Number.isInteger(value)) {
        return value.toFixed(2);
      }
      return String(Math.round(value));
    }

    function buildShape(params) {
      const left = [];
      const right = [];
      const spinePoints = [];
      const sections = [];

      for (let i = 0; i <= sampleCount; i += 1) {
        const s = i / sampleCount;
        const t = 0.5 - 0.5 * Math.cos(Math.PI * s);
        const center = spine(t, params);
        const tangent = derivative(t, params);
        const normal = unit({ x: -tangent.y, y: tangent.x });
        const radius = radiusAt(t, params);

        left.push({
          x: center.x + normal.x * radius,
          y: center.y + normal.y * radius
        });
        right.push({
          x: center.x - normal.x * radius,
          y: center.y - normal.y * radius
        });
        spinePoints.push(center);

        if (i % 44 === 0 || i === sampleCount) {
          sections.push({
            left: left[left.length - 1],
            right: right[right.length - 1]
          });
        }
      }

      return {
        left,
        right,
        spine: spinePoints,
        sections,
        outline: right.concat(left.slice(1, -1).reverse())
      };
    }

    function spine(t, params) {
      const tail = smoothstep(0.64, 1, t);
      const curl = Math.sin(Math.PI * tail) * tail;
      const x = params.bend * Math.pow(t, 2.35) +
        params.hook * (0.95 * curl + 0.14 * tail);
      const y = -params.length / 2 +
        params.length * t;
      return { x, y };
    }

    function derivative(t, params) {
      const step = 0.001;
      const a = spine(clamp(t - step, 0, 1), params);
      const b = spine(clamp(t + step, 0, 1), params);
      return { x: b.x - a.x, y: b.y - a.y };
    }

    function radiusAt(t, params) {
      if (t <= 0 || t >= 1) {
        return 0;
      }

      const peak = params.headPos;
      if (t <= peak) {
        const u = clamp(t / peak, 0, 1);
        const rise = Math.sin(u * Math.PI * 0.5);
        return params.headSize * Math.pow(rise, params.headSmooth);
      }

      const u = clamp((t - peak) / (1 - peak), 0, 1);
      const fall = Math.cos(u * Math.PI * 0.5);
      return params.headSize * Math.pow(Math.max(0, fall), params.tailTaper);
    }

    function drawShape(points) {
      ctx.beginPath();
      points.forEach((point, index) => {
        if (index === 0) {
          ctx.moveTo(point.x, point.y);
        } else {
          ctx.lineTo(point.x, point.y);
        }
      });
      ctx.closePath();
      ctx.fillStyle = "#000";
      ctx.fill();
    }

    function drawGuides(shape) {
      ctx.save();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.58)";
      ctx.lineWidth = 1.5 / view.scale;
      shape.sections.forEach((section) => {
        ctx.beginPath();
        ctx.moveTo(section.left.x, section.left.y);
        ctx.lineTo(section.right.x, section.right.y);
        ctx.stroke();
      });

      ctx.beginPath();
      shape.spine.forEach((point, index) => {
        if (index === 0) {
          ctx.moveTo(point.x, point.y);
        } else {
          ctx.lineTo(point.x, point.y);
        }
      });
      ctx.strokeStyle = "#1d73e8";
      ctx.lineWidth = 3 / view.scale;
      ctx.lineCap = "round";
      ctx.stroke();

      ctx.restore();
    }

    function fitView(points) {
      const bounds = boundsOf(points);
      const pad = 44;
      const w = window.innerWidth;
      const h = window.innerHeight;
      const modelWidth = bounds.maxX - bounds.minX;
      const modelHeight = bounds.maxY - bounds.minY;
      const scale = Math.min((w - pad * 2) / modelWidth, (h - pad * 2) / modelHeight);

      return {
        scale,
        x: (w - modelWidth * scale) / 2 - bounds.minX * scale,
        y: (h - modelHeight * scale) / 2 - bounds.minY * scale
      };
    }

    function exportSvg() {
      const params = readParams();
      const shape = buildShape(params);
      const bounds = boundsOf(shape.outline);
      const pad = 20;
      const minX = bounds.minX - pad;
      const minY = bounds.minY - pad;
      const width = bounds.maxX - bounds.minX + pad * 2;
      const height = bounds.maxY - bounds.minY + pad * 2;
      const guideMarkup = params.guides
        ? `\n  <path d="${sectionsToPath(shape.sections)}" fill="none" stroke="rgba(255,255,255,0.58)" stroke-width="1.5"/>\n  <path d="${pointsToOpenPath(shape.spine)}" fill="none" stroke="#1d73e8" stroke-width="3" stroke-linecap="round"/>`
        : "";
      const svg = [
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${round(minX)} ${round(minY)} ${round(width)} ${round(height)}">`,
        `  <rect x="${round(minX)}" y="${round(minY)}" width="${round(width)}" height="${round(height)}" fill="white"/>`,
        `  <path d="${pointsToClosedPath(shape.outline)}" fill="black"/>${guideMarkup}`,
        "</svg>"
      ].join("\n");

      const blob = new Blob([svg], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "spine-radius-drop.svg";
      link.click();
      window.setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    function pointsToClosedPath(points) {
      const commands = [`M ${round(points[0].x)} ${round(points[0].y)}`];
      for (let i = 1; i < points.length; i += 1) {
        commands.push(`L ${round(points[i].x)} ${round(points[i].y)}`);
      }
      commands.push("Z");
      return commands.join(" ");
    }

    function pointsToOpenPath(points) {
      const commands = [`M ${round(points[0].x)} ${round(points[0].y)}`];
      for (let i = 1; i < points.length; i += 1) {
        commands.push(`L ${round(points[i].x)} ${round(points[i].y)}`);
      }
      return commands.join(" ");
    }

    function sectionsToPath(sections) {
      return sections.map((section) => {
        return `M ${round(section.left.x)} ${round(section.left.y)} L ${round(section.right.x)} ${round(section.right.y)}`;
      }).join(" ");
    }

    function boundsOf(points) {
      return points.reduce((box, point) => ({
        minX: Math.min(box.minX, point.x),
        minY: Math.min(box.minY, point.y),
        maxX: Math.max(box.maxX, point.x),
        maxY: Math.max(box.maxY, point.y)
      }), {
        minX: Infinity,
        minY: Infinity,
        maxX: -Infinity,
        maxY: -Infinity
      });
    }

    function smoothstep(edge0, edge1, value) {
      const x = clamp((value - edge0) / (edge1 - edge0), 0, 1);
      return x * x * (3 - 2 * x);
    }

    function unit(vector) {
      const length = Math.hypot(vector.x, vector.y) || 1;
      return { x: vector.x / length, y: vector.y / length };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function round(value) {
      return Math.round(value * 100) / 100;
    }

    function resetControls() {
      Object.entries(defaults).forEach(([key, value]) => {
        const input = controls.querySelector(`[name="${key}"]`);
        if (!input) {
          return;
        }
        if (input.type === "checkbox") {
          input.checked = Boolean(value);
        } else {
          input.value = String(value);
        }
      });
      draw();
    }

    controls.addEventListener("input", draw);
    resetButton.addEventListener("click", resetControls);
    exportButton.addEventListener("click", exportSvg);
    window.addEventListener("resize", resize);

    resize();
  </script>
</body>
</html>
