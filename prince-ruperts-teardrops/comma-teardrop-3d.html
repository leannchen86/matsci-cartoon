<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spine Radius Drop 3D</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #fff;
    }

    .panel {
      position: fixed;
      top: 12px;
      right: 12px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      width: min(310px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow: auto;
      padding: 10px;
      border: 1px solid #000;
      background: rgba(255, 255, 255, 0.94);
      color: #000;
      font-size: 13px;
    }

    .row {
      display: grid;
      grid-template-columns: 78px 1fr 48px;
      gap: 8px;
      align-items: center;
      min-height: 28px;
    }

    .row.checkbox {
      grid-template-columns: 1fr auto;
    }

    label,
    output {
      line-height: 1.2;
    }

    output {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #000;
    }

    input[type="checkbox"] {
      accent-color: #000;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      min-height: 32px;
      border: 1px solid #000;
      border-radius: 0;
      background: #fff;
      color: #000;
      font: inherit;
      cursor: pointer;
    }

    button:active {
      background: #000;
      color: #fff;
    }

    @media (max-width: 640px) {
      .panel {
        width: min(260px, calc(100vw - 24px));
        gap: 5px;
        padding: 8px;
        font-size: 12px;
      }

      .row {
        grid-template-columns: 68px 1fr 38px;
        gap: 6px;
        min-height: 23px;
      }

      button {
        min-height: 28px;
      }
    }
  </style>
</head>
<body>
  <form class="panel" id="controls">
    <div class="row">
      <label for="headSize">Head</label>
      <input id="headSize" name="headSize" type="range" min="70" max="180" value="134" step="1">
      <output for="headSize"></output>
    </div>
    <div class="row">
      <label for="headPos">Position</label>
      <input id="headPos" name="headPos" type="range" min="0.10" max="0.30" value="0.10" step="0.01">
      <output for="headPos"></output>
    </div>
    <div class="row">
      <label for="headSmooth">Head ease</label>
      <input id="headSmooth" name="headSmooth" type="range" min="0.35" max="1.40" value="0.35" step="0.01">
      <output for="headSmooth"></output>
    </div>
    <div class="row">
      <label for="tailTaper">Tail taper</label>
      <input id="tailTaper" name="tailTaper" type="range" min="1.0" max="8.0" value="4.60" step="0.1">
      <output for="tailTaper"></output>
    </div>
    <div class="row">
      <label for="bend">Bend</label>
      <input id="bend" name="bend" type="range" min="320" max="860" value="824" step="1">
      <output for="bend"></output>
    </div>
    <div class="row">
      <label for="hook">Hook</label>
      <input id="hook" name="hook" type="range" min="-160" max="160" value="160" step="1">
      <output for="hook"></output>
    </div>
    <div class="row">
      <label for="depth">Depth</label>
      <input id="depth" name="depth" type="range" min="-260" max="260" value="145" step="1">
      <output for="depth"></output>
    </div>
    <div class="row">
      <label for="length">Length</label>
      <input id="length" name="length" type="range" min="900" max="1500" value="1490" step="5">
      <output for="length"></output>
    </div>
    <div class="row">
      <label for="quench">Quench</label>
      <input id="quench" name="quench" type="range" min="0.55" max="2.20" value="1.10" step="0.05">
      <output for="quench"></output>
    </div>
    <div class="row">
      <label for="shell">Shell</label>
      <input id="shell" name="shell" type="range" min="0.12" max="1.0" value="0.38" step="0.01">
      <output for="shell"></output>
    </div>
    <label class="row checkbox" for="stress">
      <span>Stress</span>
      <input id="stress" name="stress" type="checkbox" checked>
    </label>
    <label class="row checkbox" for="cut">
      <span>Cut</span>
      <input id="cut" name="cut" type="checkbox" checked>
    </label>
    <div class="actions">
      <button id="reset" type="button">Reset</button>
      <button id="fit" type="button">Fit</button>
    </div>
  </form>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const controlsForm = document.getElementById("controls");
    const resetButton = document.getElementById("reset");
    const fitButton = document.getElementById("fit");

    const defaults = {
      headSize: 134,
      headPos: 0.10,
      headSmooth: 0.35,
      tailTaper: 4.60,
      bend: 824,
      hook: 160,
      depth: 145,
      length: 1490,
      quench: 1.10,
      shell: 0.38,
      stress: true,
      cut: true
    };

    const spineSegments = 190;
    const radialSegments = 56;
    const cutRadialSegments = 36;
    const stressRadialNodes = 34;
    const stressTimeSteps = 360;
    const glassTransition = 0.82;
    const femAxialNodes = 34;
    const femRadialNodes = 12;
    const femMaxIterations = 900;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    const camera = new THREE.PerspectiveCamera(32, 1, 1, 6000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setClearColor(0xffffff, 1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.insertBefore(renderer.domElement, controlsForm);

    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.08;
    orbit.autoRotate = true;
    orbit.autoRotateSpeed = 0.12;

    const dropMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.56,
      metalness: 0.0,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: defaults.shell,
      depthWrite: false,
      vertexColors: true
    });

    const mesh = new THREE.Mesh(new THREE.BufferGeometry(), dropMaterial);
    mesh.renderOrder = 1;
    scene.add(mesh);

    const cutMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide,
      vertexColors: true
    });

    const cutMesh = new THREE.Mesh(new THREE.BufferGeometry(), cutMaterial);
    cutMesh.renderOrder = 2;
    scene.add(cutMesh);

    scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d9d9, 1.25));

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
    keyLight.position.set(-260, -360, 780);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 0.55);
    rimLight.position.set(540, 430, 260);
    scene.add(rimLight);

    let latestFrames = [];
    let latestSphere = new THREE.Sphere(new THREE.Vector3(), 1);
    let fittedOnce = false;

    function readParams() {
      const data = new FormData(controlsForm);
      return {
        headSize: Number(data.get("headSize")),
        headPos: Number(data.get("headPos")),
        headSmooth: Number(data.get("headSmooth")),
        tailTaper: Number(data.get("tailTaper")),
        bend: Number(data.get("bend")),
        hook: Number(data.get("hook")),
        depth: Number(data.get("depth")),
        length: Number(data.get("length")),
        quench: Number(data.get("quench")),
        shell: Number(data.get("shell")),
        stress: data.has("stress"),
        cut: data.has("cut")
      };
    }

    function writeOutputs(params) {
      controlsForm.querySelectorAll("input[type='range']").forEach((input) => {
        const output = controlsForm.querySelector(`output[for='${input.id}']`);
        output.value = formatValue(params[input.name]);
      });
    }

    function formatValue(value) {
      if (Math.abs(value) < 10 && !Number.isInteger(value)) {
        return value.toFixed(2);
      }
      return String(Math.round(value));
    }

    function rebuild(options = {}) {
      const params = readParams();
      writeOutputs(params);
      updateMaterial(params);
      const frames = buildFrames(params);
      const stressModel = buildStressModel(params);
      document.body.dataset.stressMin = stressModel.min.toFixed(1);
      document.body.dataset.stressMax = stressModel.max.toFixed(1);

      const model = buildSurface(params, frames, stressModel);
      mesh.geometry.dispose();
      mesh.geometry = model.geometry;
      cutMesh.geometry.dispose();
      cutMesh.geometry = model.cutGeometry;
      latestFrames = frames;
      window.__stressModel = stressModel;

      mesh.geometry.computeBoundingSphere();
      latestSphere = mesh.geometry.boundingSphere.clone();
      updateCameraBounds();

      if (!fittedOnce || options.fit) {
        fitCamera();
        fittedOnce = true;
      }
    }

    function buildSurface(params, frames, stressModel) {
      const positions = [];
      const colors = [];
      const uvs = [];
      const indices = [];
      const ringCount = params.cut ? Math.floor(radialSegments / 2) + 1 : radialSegments;
      const ringSegments = params.cut ? ringCount - 1 : radialSegments;
      const angleStart = params.cut ? Math.PI : 0;
      const angleSpan = params.cut ? Math.PI : Math.PI * 2;

      frames.forEach((frame, i) => {
        const t = frame.t;
        const radius = radiusAt(t, params);
        const color = params.stress ?
          stressColor(stressModel.sample(t, 1)) :
          new THREE.Color(0x050505);

        for (let j = 0; j < ringCount; j += 1) {
          const amount = params.cut ? j / (ringCount - 1) : j / radialSegments;
          const angle = angleStart + amount * angleSpan;
          const offset = frame.normal.clone()
            .multiplyScalar(Math.cos(angle) * radius)
            .add(frame.binormal.clone().multiplyScalar(Math.sin(angle) * radius));
          const point = frame.center.clone().add(offset);

          positions.push(point.x, point.y, point.z);
          colors.push(color.r, color.g, color.b);
          uvs.push(j / radialSegments, t);
        }
      });

      for (let i = 0; i < frames.length - 1; i += 1) {
        for (let j = 0; j < ringSegments; j += 1) {
          const next = params.cut ? j + 1 : (j + 1) % ringCount;
          const a = i * ringCount + j;
          const b = i * ringCount + next;
          const c = (i + 1) * ringCount + j;
          const d = (i + 1) * ringCount + next;

          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return {
        geometry,
        cutGeometry: params.cut ? buildCutGeometry(params, frames, stressModel) : new THREE.BufferGeometry()
      };
    }

    function buildCutGeometry(params, frames, stressModel) {
      const positions = [];
      const colors = [];
      const uvs = [];
      const indices = [];

      frames.forEach((frame) => {
        const t = frame.t;
        const radius = radiusAt(t, params);
        for (let j = 0; j <= cutRadialSegments; j += 1) {
          const across = j / cutRadialSegments;
          const signedRadius = (across * 2 - 1) * radius;
          const rho = Math.abs(across * 2 - 1);
          const point = frame.center.clone().add(frame.normal.clone().multiplyScalar(signedRadius));
          const color = params.stress ?
            stressColor(stressModel.sample(t, rho)) :
            new THREE.Color(0x050505);

          positions.push(point.x, point.y, point.z);
          colors.push(color.r, color.g, color.b);
          uvs.push(across, t);
        }
      });

      const rowCount = cutRadialSegments + 1;
      for (let i = 0; i < frames.length - 1; i += 1) {
        for (let j = 0; j < cutRadialSegments; j += 1) {
          const a = i * rowCount + j;
          const b = i * rowCount + j + 1;
          const c = (i + 1) * rowCount + j;
          const d = (i + 1) * rowCount + j + 1;

          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function buildFrames(params) {
      const frames = [];
      const firstTangent = tangentAt(0, params);
      let normal = initialNormal(firstTangent);
      let binormal = new THREE.Vector3().crossVectors(firstTangent, normal).normalize();
      let previousTangent = firstTangent;

      for (let i = 0; i <= spineSegments; i += 1) {
        const s = i / spineSegments;
        const t = 0.5 - 0.5 * Math.cos(Math.PI * s);
        const center = spine(t, params);
        const tangent = tangentAt(t, params);

        if (i > 0) {
          const rotation = new THREE.Quaternion().setFromUnitVectors(previousTangent, tangent);
          normal.applyQuaternion(rotation).normalize();
          binormal.crossVectors(tangent, normal).normalize();
          normal.crossVectors(binormal, tangent).normalize();
        }

        frames.push({
          t,
          center,
          tangent: tangent.clone(),
          normal: normal.clone(),
          binormal: binormal.clone()
        });

        previousTangent = tangent;
      }

      return frames;
    }

    function spine(t, params) {
      const tail = smoothstep(0.64, 1, t);
      const curl = Math.sin(Math.PI * tail) * tail;
      const x = params.bend * Math.pow(t, 2.35) +
        params.hook * (0.95 * curl + 0.14 * tail);
      const y = params.length / 2 - params.length * t;
      const z = params.depth * Math.sin(Math.PI * t) * Math.pow(t, 0.7);
      return new THREE.Vector3(x, y, z);
    }

    function tangentAt(t, params) {
      const step = 0.001;
      const a = spine(clamp(t - step, 0, 1), params);
      const b = spine(clamp(t + step, 0, 1), params);
      return b.sub(a).normalize();
    }

    function initialNormal(tangent) {
      const zAxis = new THREE.Vector3(0, 0, 1);
      const xAxis = new THREE.Vector3(1, 0, 0);
      const reference = Math.abs(tangent.dot(zAxis)) > 0.92 ? xAxis : zAxis;
      return new THREE.Vector3().crossVectors(reference, tangent).normalize();
    }

    function radiusAt(t, params) {
      if (t <= 0 || t >= 1) {
        return 0;
      }

      const peak = params.headPos;
      if (t <= peak) {
        const u = clamp(t / peak, 0, 1);
        const rise = Math.sin(u * Math.PI * 0.5);
        return params.headSize * Math.pow(rise, params.headSmooth);
      }

      const u = clamp((t - peak) / (1 - peak), 0, 1);
      const fall = Math.cos(u * Math.PI * 0.5);
      return params.headSize * Math.pow(Math.max(0, fall), params.tailTaper);
    }

    // Residual-stress model for a cooled drop: infer frozen-in shrinkage from
    // a radial quench history, then solve elastic equilibrium on a t-rho mesh.
    function buildStressModel(params) {
      const axialCount = femAxialNodes;
      const radialCount = femRadialNodes;
      const nodeCount = axialCount * radialCount;
      const dofCount = nodeCount * 2;
      const radii = new Float32Array(axialCount);
      const arc = new Float32Array(axialCount);
      const freeStrain = new Float32Array(nodeCount);
      const nodalStress = new Float32Array(nodeCount);
      let maxRadius = 0;

      let previousCenter = null;
      for (let i = 0; i < axialCount; i += 1) {
        const t = i / (axialCount - 1);
        const radius = radiusAt(t, params);
        maxRadius = Math.max(maxRadius, radius);
        radii[i] = radius;

        const center = spine(t, params);
        if (previousCenter) {
          arc[i] = arc[i - 1] + center.distanceTo(previousCenter);
        }
        previousCenter = center;
      }

      const lockTimes = [];
      let meanLock = 0;
      let meanWeight = 0;

      for (let i = 0; i < axialCount; i += 1) {
        const radiusNorm = clamp(radii[i] / Math.max(maxRadius, 1), 0.06, 1);
        const locks = solveCoolingColumn(radiusNorm, params.quench);
        lockTimes.push(locks);

        for (let k = 0; k < radialCount; k += 1) {
          const rho = k / (radialCount - 1);
          const lock = sampleArray(locks, rho);
          const areaWeight = Math.max(rho, 0.35 / (radialCount - 1)) *
            smoothstep(0.025, 0.16, radii[i] / Math.max(maxRadius, 1));
          meanLock += lock * areaWeight;
          meanWeight += areaWeight;
        }
      }

      meanLock /= Math.max(meanWeight, 1e-6);

      for (let i = 0; i < axialCount; i += 1) {
        const capacity = smoothstep(0.025, 0.16, radii[i] / Math.max(maxRadius, 1));
        for (let k = 0; k < radialCount; k += 1) {
          const rho = k / (radialCount - 1);
          const index = i * radialCount + k;
          freeStrain[index] = (sampleArray(lockTimes[i], rho) - meanLock) * capacity;
        }
      }

      const system = createSparseSystem(dofCount);
      const rhs = new Float32Array(dofCount);
      const elementStress = [];
      const dMatrix = planeStressMatrix(1, 0.22);

      for (let i = 0; i < axialCount - 1; i += 1) {
        for (let k = 0; k < radialCount - 1; k += 1) {
          assembleElement(system, rhs, elementStress, {
            i,
            k,
            axialCount,
            radialCount,
            arc,
            radii,
            freeStrain,
            dMatrix
          });
        }
      }

      const diagonalAverage = averageDiagonal(system);
      pinDof(system, rhs, nodeDof(radialCount, 0, 0, 0), diagonalAverage);
      pinDof(system, rhs, nodeDof(radialCount, 0, 0, 1), diagonalAverage);
      pinDof(system, rhs, nodeDof(radialCount, axialCount - 1, 0, 1), diagonalAverage);

      const displacement = conjugateGradient(system, rhs, femMaxIterations, 1e-5);
      const weights = new Float32Array(nodeCount);
      let minStress = 0;
      let maxStress = 0;

      elementStress.forEach((element) => {
        const stressValue = evaluateElementStress(element, displacement, dMatrix);
        element.nodes.forEach((nodeIndex) => {
          nodalStress[nodeIndex] += stressValue;
          weights[nodeIndex] += 1;
        });
      });

      for (let index = 0; index < nodeCount; index += 1) {
        if (weights[index] > 0) {
          nodalStress[index] /= weights[index];
        }
      }

      const headIndex = Math.max(1, Math.round(params.headPos * (axialCount - 1)));
      const coreHead = nodalStress[headIndex * radialCount];
      const surfaceHead = nodalStress[headIndex * radialCount + radialCount - 1];
      const sign = coreHead < surfaceHead ? -1 : 1;

      for (let index = 0; index < nodeCount; index += 1) {
        nodalStress[index] *= sign;
        minStress = Math.min(minStress, nodalStress[index]);
        maxStress = Math.max(maxStress, nodalStress[index]);
      }

      const compressionScale = minStress < 0 ? 650 / Math.abs(minStress) : 0;
      const tensionScale = maxStress > 0 ? 420 / maxStress : 0;
      const scale = Math.min(compressionScale || tensionScale, tensionScale || compressionScale);
      minStress = 0;
      maxStress = 0;

      for (let index = 0; index < nodeCount; index += 1) {
        nodalStress[index] *= scale;
        minStress = Math.min(minStress, nodalStress[index]);
        maxStress = Math.max(maxStress, nodalStress[index]);
      }

      return {
        min: minStress,
        max: maxStress,
        sample(t, rho) {
          const u = clamp(t, 0, 1) * (axialCount - 1);
          const v = clamp(rho, 0, 1) * (radialCount - 1);
          const i0 = Math.floor(u);
          const k0 = Math.floor(v);
          const i1 = Math.min(i0 + 1, axialCount - 1);
          const k1 = Math.min(k0 + 1, radialCount - 1);
          const fu = u - i0;
          const fv = v - k0;
          const a = nodalStress[i0 * radialCount + k0];
          const b = nodalStress[i1 * radialCount + k0];
          const c = nodalStress[i0 * radialCount + k1];
          const d = nodalStress[i1 * radialCount + k1];
          return lerp(lerp(a, b, fu), lerp(c, d, fu), fv);
        }
      };
    }

    function assembleElement(system, rhs, elementStress, data) {
      const { i, k, radialCount, arc, radii, freeStrain, dMatrix } = data;
      const nodeIds = [
        i * radialCount + k,
        (i + 1) * radialCount + k,
        (i + 1) * radialCount + k + 1,
        i * radialCount + k + 1
      ];
      const dofs = [
        nodeIds[0] * 2,
        nodeIds[0] * 2 + 1,
        nodeIds[1] * 2,
        nodeIds[1] * 2 + 1,
        nodeIds[2] * 2,
        nodeIds[2] * 2 + 1,
        nodeIds[3] * 2,
        nodeIds[3] * 2 + 1
      ];
      const x = [
        arc[i],
        arc[i + 1],
        arc[i + 1],
        arc[i]
      ];
      const y = [
        (k / (radialCount - 1)) * radii[i],
        (k / (radialCount - 1)) * radii[i + 1],
        ((k + 1) / (radialCount - 1)) * radii[i + 1],
        ((k + 1) / (radialCount - 1)) * radii[i]
      ];
      const areaGate = smoothstep(1.5, 8, Math.max(radii[i], radii[i + 1]));
      if (areaGate <= 0) {
        return;
      }

      const elementStrain = (
        freeStrain[nodeIds[0]] +
        freeStrain[nodeIds[1]] +
        freeStrain[nodeIds[2]] +
        freeStrain[nodeIds[3]]
      ) * 0.25;
      const stressRecord = {
        nodes: nodeIds,
        dofs,
        samples: []
      };
      const gauss = [-1 / Math.sqrt(3), 1 / Math.sqrt(3)];

      gauss.forEach((xi) => {
        gauss.forEach((eta) => {
          const sample = elementSample(x, y, xi, eta);
          const weight = Math.max(sample.detJ, 0) * areaGate;
          if (weight <= 1e-8) {
            return;
          }

          const db = multiplyDB(dMatrix, sample.b);
          for (let a = 0; a < 8; a += 1) {
            for (let b = 0; b < 8; b += 1) {
              addSparse(system, dofs[a], dofs[b], dotColumn(sample.b, db, a, b) * weight);
            }
          }

          const thermal = [
            elementStrain,
            elementStrain,
            0
          ];
          const dThermal = multiplyMatrixVector(dMatrix, thermal);
          for (let a = 0; a < 8; a += 1) {
            rhs[dofs[a]] += dotBVector(sample.b, dThermal, a) * weight;
          }

          stressRecord.samples.push({
            b: sample.b,
            thermal
          });
        });
      });

      if (stressRecord.samples.length > 0) {
        elementStress.push(stressRecord);
      }
    }

    function elementSample(x, y, xi, eta) {
      const dNdxi = [
        -(1 - eta) * 0.25,
        (1 - eta) * 0.25,
        (1 + eta) * 0.25,
        -(1 + eta) * 0.25
      ];
      const dNdeta = [
        -(1 - xi) * 0.25,
        -(1 + xi) * 0.25,
        (1 + xi) * 0.25,
        (1 - xi) * 0.25
      ];
      let j00 = 0;
      let j01 = 0;
      let j10 = 0;
      let j11 = 0;

      for (let n = 0; n < 4; n += 1) {
        j00 += dNdxi[n] * x[n];
        j01 += dNdxi[n] * y[n];
        j10 += dNdeta[n] * x[n];
        j11 += dNdeta[n] * y[n];
      }

      const detJ = j00 * j11 - j01 * j10;
      const b = new Float32Array(24);
      if (Math.abs(detJ) < 1e-8) {
        return { b, detJ: 0 };
      }
      const inv00 = j11 / detJ;
      const inv01 = -j01 / detJ;
      const inv10 = -j10 / detJ;
      const inv11 = j00 / detJ;

      for (let n = 0; n < 4; n += 1) {
        const dNdx = inv00 * dNdxi[n] + inv01 * dNdeta[n];
        const dNdy = inv10 * dNdxi[n] + inv11 * dNdeta[n];
        const col = n * 2;
        b[col] = dNdx;
        b[8 + col + 1] = dNdy;
        b[16 + col] = dNdy;
        b[16 + col + 1] = dNdx;
      }

      return { b, detJ: Math.abs(detJ) };
    }

    function planeStressMatrix(elasticModulus, poissonRatio) {
      const c = elasticModulus / (1 - poissonRatio * poissonRatio);
      return new Float32Array([
        c,
        c * poissonRatio,
        0,
        c * poissonRatio,
        c,
        0,
        0,
        0,
        c * (1 - poissonRatio) * 0.5
      ]);
    }

    function multiplyDB(dMatrix, bMatrix) {
      const result = new Float32Array(24);
      for (let row = 0; row < 3; row += 1) {
        for (let col = 0; col < 8; col += 1) {
          result[row * 8 + col] =
            dMatrix[row * 3] * bMatrix[col] +
            dMatrix[row * 3 + 1] * bMatrix[8 + col] +
            dMatrix[row * 3 + 2] * bMatrix[16 + col];
        }
      }
      return result;
    }

    function multiplyMatrixVector(matrix, vector) {
      return [
        matrix[0] * vector[0] + matrix[1] * vector[1] + matrix[2] * vector[2],
        matrix[3] * vector[0] + matrix[4] * vector[1] + matrix[5] * vector[2],
        matrix[6] * vector[0] + matrix[7] * vector[1] + matrix[8] * vector[2]
      ];
    }

    function dotColumn(bMatrix, dbMatrix, a, b) {
      return bMatrix[a] * dbMatrix[b] +
        bMatrix[8 + a] * dbMatrix[8 + b] +
        bMatrix[16 + a] * dbMatrix[16 + b];
    }

    function dotBVector(bMatrix, vector, column) {
      return bMatrix[column] * vector[0] +
        bMatrix[8 + column] * vector[1] +
        bMatrix[16 + column] * vector[2];
    }

    function evaluateElementStress(element, displacement, dMatrix) {
      let signed = 0;
      element.samples.forEach((sample) => {
        const strain = [0, 0, 0];
        for (let a = 0; a < 8; a += 1) {
          const value = displacement[element.dofs[a]];
          strain[0] += sample.b[a] * value;
          strain[1] += sample.b[8 + a] * value;
          strain[2] += sample.b[16 + a] * value;
        }

        strain[0] -= sample.thermal[0];
        strain[1] -= sample.thermal[1];
        strain[2] -= sample.thermal[2];

        const sigma = multiplyMatrixVector(dMatrix, strain);
        const mean = (sigma[0] + sigma[1]) * 0.5;
        const radius = Math.sqrt(Math.pow((sigma[0] - sigma[1]) * 0.5, 2) + sigma[2] * sigma[2]);
        const principalMax = mean + radius;
        const principalMin = mean - radius;
        signed += principalMax > Math.abs(principalMin) ? principalMax : principalMin;
      });

      return signed / element.samples.length;
    }

    function createSparseSystem(size) {
      return Array.from({ length: size }, () => new Map());
    }

    function addSparse(system, row, col, value) {
      system[row].set(col, (system[row].get(col) || 0) + value);
    }

    function averageDiagonal(system) {
      let total = 0;
      let count = 0;
      system.forEach((row, index) => {
        if (row.has(index)) {
          total += Math.abs(row.get(index));
          count += 1;
        }
      });
      return count > 0 ? total / count : 1;
    }

    function pinDof(system, rhs, dof, diagonalAverage) {
      const penalty = Math.max(diagonalAverage, 1) * 100000;
      addSparse(system, dof, dof, penalty);
      rhs[dof] = 0;
    }

    function nodeDof(radialCount, axialIndex, radialIndex, component) {
      return ((axialIndex * radialCount + radialIndex) * 2) + component;
    }

    function conjugateGradient(system, rhs, maxIterations, tolerance) {
      const n = rhs.length;
      const x = new Float32Array(n);
      const r = new Float32Array(rhs);
      const p = new Float32Array(rhs);
      const ap = new Float32Array(n);
      let rsOld = dotVector(r, r);
      const target = Math.max(tolerance * tolerance * rsOld, 1e-18);

      for (let iteration = 0; iteration < maxIterations; iteration += 1) {
        multiplySparse(system, p, ap);
        const alpha = rsOld / Math.max(dotVector(p, ap), 1e-18);

        for (let i = 0; i < n; i += 1) {
          x[i] += alpha * p[i];
          r[i] -= alpha * ap[i];
        }

        const rsNew = dotVector(r, r);
        if (rsNew < target) {
          break;
        }

        const beta = rsNew / rsOld;
        for (let i = 0; i < n; i += 1) {
          p[i] = r[i] + beta * p[i];
        }
        rsOld = rsNew;
      }

      return x;
    }

    function multiplySparse(system, vector, out) {
      out.fill(0);
      system.forEach((row, rowIndex) => {
        let sum = 0;
        row.forEach((value, colIndex) => {
          sum += value * vector[colIndex];
        });
        out[rowIndex] = sum;
      });
    }

    function dotVector(a, b) {
      let sum = 0;
      for (let i = 0; i < a.length; i += 1) {
        sum += a[i] * b[i];
      }
      return sum;
    }

    function sampleArray(values, t) {
      const scaled = clamp(t, 0, 1) * (values.length - 1);
      const index = Math.floor(scaled);
      const nextIndex = Math.min(index + 1, values.length - 1);
      return lerp(values[index], values[nextIndex], scaled - index);
    }

    function solveCoolingColumn(radiusNorm, quench) {
      const radialCount = stressRadialNodes;
      const dr = 1 / (radialCount - 1);
      const dt = 0.018;
      const temp = new Float32Array(radialCount);
      const next = new Float32Array(radialCount);
      const lockTimes = new Float32Array(radialCount);
      const lower = new Float32Array(radialCount);
      const diag = new Float32Array(radialCount);
      const upper = new Float32Array(radialCount);
      const rhs = new Float32Array(radialCount);
      const previous = new Float32Array(radialCount);
      const cPrime = new Float32Array(radialCount);
      const dPrime = new Float32Array(radialCount);

      temp.fill(1);
      lockTimes.fill(-1);

      const radiusTerm = 1 / Math.max(radiusNorm * radiusNorm, 0.014);
      const thermalDiffusivity = 0.012;
      const surfaceCooling = quench * (1.15 + 1.35 * (1 - radiusNorm));

      for (let step = 1; step <= stressTimeSteps; step += 1) {
        previous.set(temp);

        for (let k = 0; k < radialCount; k += 1) {
          lower[k] = 0;
          upper[k] = 0;
          rhs[k] = temp[k];
        }

        for (let k = 0; k < radialCount; k += 1) {
          const lambda = dt * thermalDiffusivity * radiusTerm;
          if (k === 0) {
            diag[k] = 1 + 4 * lambda / (dr * dr);
            upper[k] = -4 * lambda / (dr * dr);
          } else if (k === radialCount - 1) {
            diag[k] = 1 + 2 * lambda / (dr * dr) + dt * surfaceCooling;
            lower[k] = -2 * lambda / (dr * dr);
          } else {
            const rho = k * dr;
            const radial = 1 / (2 * rho * dr);
            const second = 1 / (dr * dr);
            lower[k] = -lambda * (second - radial);
            diag[k] = 1 + 2 * lambda * second;
            upper[k] = -lambda * (second + radial);
          }
        }

        solveTridiagonal(lower, diag, upper, rhs, next, cPrime, dPrime);
        temp.set(next);

        for (let k = 0; k < radialCount; k += 1) {
          if (lockTimes[k] >= 0 || temp[k] > glassTransition) {
            continue;
          }
          const drop = previous[k] - temp[k];
          const fraction = drop > 0 ? (previous[k] - glassTransition) / drop : 1;
          lockTimes[k] = (step - 1 + clamp(fraction, 0, 1)) * dt;
        }
      }

      for (let k = 0; k < radialCount; k += 1) {
        if (lockTimes[k] < 0) {
          lockTimes[k] = stressTimeSteps * dt;
        }
      }

      return lockTimes;
    }

    function solveTridiagonal(lower, diag, upper, rhs, out, cPrime, dPrime) {
      const n = diag.length;

      cPrime[0] = upper[0] / diag[0];
      dPrime[0] = rhs[0] / diag[0];

      for (let i = 1; i < n; i += 1) {
        const denom = diag[i] - lower[i] * cPrime[i - 1];
        cPrime[i] = i < n - 1 ? upper[i] / denom : 0;
        dPrime[i] = (rhs[i] - lower[i] * dPrime[i - 1]) / denom;
      }

      out[n - 1] = dPrime[n - 1];
      for (let i = n - 2; i >= 0; i -= 1) {
        out[i] = dPrime[i] - cPrime[i] * out[i + 1];
      }
    }

    function updateMaterial(params) {
      dropMaterial.opacity = params.shell;
      dropMaterial.transparent = params.shell < 1;
      dropMaterial.depthWrite = params.shell >= 0.96;
      dropMaterial.vertexColors = params.stress;
      dropMaterial.color.set(params.stress ? 0xffffff : 0x050505);
      dropMaterial.roughness = params.stress ? 0.56 : 0.72;
      dropMaterial.needsUpdate = true;
      cutMesh.visible = params.cut;
      cutMaterial.vertexColors = params.stress;
      cutMaterial.color.set(params.stress ? 0xffffff : 0x050505);
      cutMaterial.needsUpdate = true;
    }

    function stressColor(stressMpa) {
      const neutral = new THREE.Color(0xf7f0c8);
      const compression = new THREE.Color(0x206ad7);
      const tension = new THREE.Color(0xd8172f);
      if (stressMpa < 0) {
        return new THREE.Color().lerpColors(
          neutral,
          compression,
          smoothstep(0, 650, -stressMpa)
        );
      }
      return new THREE.Color().lerpColors(
        neutral,
        tension,
        smoothstep(0, 420, stressMpa)
      );
    }

    function updateCameraBounds() {
      const radius = latestSphere.radius;
      camera.near = Math.max(0.1, radius / 700);
      camera.far = radius * 12;
      camera.updateProjectionMatrix();
      orbit.minDistance = radius * 0.35;
      orbit.maxDistance = radius * 6;
      orbit.target.copy(latestSphere.center);
    }

    function fitCamera() {
      const radius = latestSphere.radius;
      const center = latestSphere.center;
      const fov = THREE.MathUtils.degToRad(camera.fov * 0.5);
      const distance = (radius / Math.sin(fov)) * 1.14;
      camera.position.set(center.x - radius * 0.12, center.y - radius * 0.04, center.z + distance);
      camera.lookAt(center);
      orbit.target.copy(center);
      orbit.update();
    }

    function resetControls() {
      Object.entries(defaults).forEach(([key, value]) => {
        const input = controlsForm.querySelector(`[name='${key}']`);
        if (!input) {
          return;
        }
        if (input.type === "checkbox") {
          input.checked = value;
        } else {
          input.value = value;
        }
      });
      rebuild({ fit: true });
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      orbit.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function lerp(a, b, amount) {
      return a + (b - a) * amount;
    }

    function smoothstep(edge0, edge1, value) {
      const t = clamp((value - edge0) / (edge1 - edge0), 0, 1);
      return t * t * (3 - 2 * t);
    }

    controlsForm.addEventListener("input", () => rebuild());
    resetButton.addEventListener("click", resetControls);
    fitButton.addEventListener("click", () => rebuild({ fit: true }));
    window.addEventListener("resize", resize);

    window.__drop3d = { scene, camera, renderer, mesh, cutMesh, orbit };

    resize();
    resetControls();
    animate();
  </script>
</body>
</html>
